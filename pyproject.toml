[project]
name = "saccade"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=4.5.0",
    "gdown>=5.2.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "optuna>=4.0.0",
    "pandas>=3.0.0",
    "peft>=0.14.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.2.0",
    "wandb>=0.18.0",
]

# Use PyTorch's CUDA wheels on Linux (x86_64 and aarch64). On non-Linux platforms,
# these sources are ignored and uv will fall back to PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
